baseURL = 'jyangchisyan.github.io'
languageCode = 'zh-tw'
title = "Samuel Jiang's Blog"
description = "專注於後端開發、系統架構與雲端運算的技術部落格。"
theme = 'PaperMod'
enableRobotsTXT = true

# Required for search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "auto" # 自動切換深色/淺色模式
  ShowReadingTime = true # 顯示閱讀時間
  ShowShareButtons = true # 顯示分享按鈕
  ShowToc = true
  ShowCodeCopyButtons = true
  ShowFullTextContent = false


  # Search Configuration
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  # Comments Configuration (Giscus)
  # Please replace with your actual repo details
  [params.comments]
    provider = "giscus"
    giscusConfig = { repo = "YOUR_REPO_ORG/YOUR_REPO_NAME", repoId = "YOUR_REPO_ID", category = "Announcements", categoryId = "YOUR_CATEGORY_ID" }
  
  [params.homeInfoParams]
    Title = "Samuel Jiang"
    Content = "專注於後端開發的工程師。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jyangchisyan"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/samuel-jiang/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:chyishian.jiang@gmail.com"

  [[params.socialIcons]]
    name = "buymeacoffee"
    url = "https://buymeacoffee.com/samueljiang"

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "歸檔" 
    url = "/archives/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "關於我"
    url = "/about/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40


[markup]
  [markup.highlight]
    codeFences = true          
    guessSyntax = true         
    lineNos = true             
    noClasses = false          
    style = "monokai"

[caches]
  [caches.images]
    dir = ':cacheDir/images'